# EdgeDash Configuration
# Edit this file with your own details

target_role: "Security Engineer"
target_city: "Berlin"

# Keywords that appear in job listings you care about
keywords:
  - "security"
  - "data analyst"
  - "business analyst"
  - "SQL"
  - "Power BI"
  - "Tableau"
  - "Python"


# Your current skills (used for gap analysis)
my_skills:
  - "security"
  - "SQL"
  - "Python"
  - "Excel"
  - "Tableau"
  - "data cleaning"
  - "statistics"

# Years of relevant experience
experience_years: 3

# Path to SQLite database
db_path: "edgedash.db"

# Minimum fit score (0-100) to surface in dashboard
min_fit_score: 70

# Enabled job sources
sources:
  - "arbeitnow"

# Use mock fetcher for offline development (ignore real sources if true)
use_mock_fetcher: false

# LLM provider: "gemini" or "ollama"
llm_provider: "gemini"

# LLM model name
llm_model: "gemini-3.6-flash"

# Target seniority level for scoring
target_seniority: "mid"

# Scoring weights (0.0-1.0)
score_weights:
  skills_match: 0.45
  seniority_match: 0.25
  location_match: 0.15
  recency: 0.15

# Max listings to score per cycle (rule 21).
# Kept low (8) to stay inside the Gemini free-tier daily request budget:
# 8 for the main pass + up to 8 for the single Verifier-triggered retry
# (rule 36) + headroom for the dashboard's "Ask your data" (2 calls/question).
score_batch_size: 8

# Minimum score range; catches a Scorer that emits nearly identical scores.
min_spread: 20.0
# Minimum population standard deviation; catches tightly clustered score output.
min_stdev: 5.0
# Maximum fraction of empty extractions; catches LLM extraction collapse.
max_empty_extraction_pct: 0.20
# Maximum skills in one listing; catches malformed or runaway extraction output.
max_skills_per_listing: 30
# Minimum listings supporting the top gap; catches unreliable low-sample gaps.
min_gap_sample: 3
# Maximum data age in days; catches stale fetches being treated as current.
max_data_age_days: 7
# Maximum questions accepted per day; catches traffic spikes exhausting the free LLM tier.
daily_query_cap: 200
# Hours to wait before retrying extraction for a listing whose previous
# extraction attempt failed (timeout / transient API error). Failed attempts
# are cached in extraction_cache and skipped for this long, so a flaky or
# overloaded model does not get re-billed for the same listing every cycle.
extraction_retry_hours: 24

